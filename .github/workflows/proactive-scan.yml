name: Proactive Scan
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call proactive-scan function
        run: |
          curl -X POST "https://ewuzdujlnmyuyxdkgkom.functions.supabase.co/proactive-scan" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
